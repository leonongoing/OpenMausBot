name: Contributor price-merged-linux validation
on:
  push:
    branches: [leon/proof-price-merged-linux-20261110]
permissions:
  contents: read
jobs:
  exact-source-full:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: source
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: proof
          sparse-checkout: ocpr-exact-proof
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2711e28132e0d0d2fcb05fe3a2ad16bb386e7a51
          path: source
          fetch-depth: 2
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Verify exact public PR source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 2711e28132e0d0d2fcb05fe3a2ad16bb386e7a51
          test -z "$(git status --porcelain)"
          node --version
          pnpm --version
          google-chrome --version
      - name: Prepare Electron test runtime
        run: node --input-type=commonjs -e "require('electron')"
      - name: Verify OpenCode price lifecycle and Bot Box compatibility
        run: |
          pnpm exec vitest run server/drivers/acp/opencode-go.test.ts server/drivers/acp/opencode-price-holds.test.ts server/bot-box/probe-box.test.ts server/engine-updates.test.ts scripts/testing/file-size-ratchet.test.ts
          pnpm exec oxlint --deny-warnings server/drivers/acp/opencode-go.ts
      - name: Full typecheck and unfiltered pnpm test
        env:
          OCPR_SOURCE_DIR: ${{ github.workspace }}/source
          OCPR_EVIDENCE_DIR: ${{ runner.temp }}/price-merged-linux
        run: node ../proof/ocpr-exact-proof/run-full.mjs
      - name: Preserve full results and CI retry evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: price-merged-linux-${{ github.run_id }}
          path: ${{ runner.temp }}/price-merged-linux
          retention-days: 3
          if-no-files-found: warn
